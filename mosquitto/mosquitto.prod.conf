# Production broker (Railway). Contrast with mosquitto.conf, which is anonymous/no-auth for
# local dev against docker-compose — this one requires the credential in passwd and has no
# other client on the same network to trust implicitly the way localhost does.
#
# TLS-only, on 8883. Railway's TCP proxy is a plain passthrough, not a TLS terminator, so
# this terminates TLS itself using certs/server.crt — a self-signed certificate, not one from
# a public CA, because this hostname is a Railway-owned subdomain (*.proxy.rlwy.net) that
# nothing here controls DNS for, so no ACME challenge (HTTP-01 or DNS-01) can be completed
# for it. Both the backend publisher and the Android client pin this exact certificate as
# their trusted root instead of relying on the public CA chain — real encryption and real
# protection against a network-path attacker, just via an explicitly trusted cert rather
# than a publicly issued one. Rotating it means updating all three places at once: this
# file, backend/app/infra/mqtt.py's bundled copy, and the Android client's.
listener 8883
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
