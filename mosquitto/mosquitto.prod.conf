# Production broker (Railway). Contrast with mosquitto.conf, which is anonymous/no-auth for
# local dev against docker-compose — this one requires the credential in passwd and has no
# other client on the same network to trust implicitly the way localhost does.
#
# Known gap, called out deliberately rather than left implicit: this is plaintext MQTT
# (no TLS). Railway's TCP proxy is a passthrough, not a TLS terminator, so encrypting this
# connection means mosquitto terminating TLS itself with real certs — real work, not yet
# done. Until then, the credential below travels in the clear. Rotate it before adding real
# devices to this broker; it exists right now to prove the deployment, not to carry device
# traffic that matters.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
