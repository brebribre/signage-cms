# Production broker (Railway). Contrast with mosquitto.conf, which is anonymous/no-auth for
# local dev against docker-compose — this one requires real credentials and has no other
# client on the same network to trust implicitly the way localhost does.
#
# TLS-only, on 8883. Railway's TCP proxy is a plain passthrough, not a TLS terminator, so
# this terminates TLS itself using certs/server.crt — a self-signed certificate, not one from
# a public CA, because this hostname is a Railway-owned subdomain (*.proxy.rlwy.net) that
# nothing here controls DNS for, so no ACME challenge (HTTP-01 or DNS-01) can be completed
# for it. Both the backend publisher and the Android client pin this exact certificate as
# their trusted root instead of relying on the public CA chain — real encryption and real
# protection against a network-path attacker, just via an explicitly trusted cert rather
# than a publicly issued one. Rotating it means updating all three places at once: this
# file, backend/app/infra/mqtt.py's bundled copy, and the Android client's.
listener 8883
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Per-device credentials, not one password shared by every screen. The dynamic-security
# plugin manages its own client/role/ACL store in dynamic-security.json (seeded once from
# this repo, then live-mutated by the backend's admin connection as devices pair — see
# app/infra/mqtt_admin.py) rather than a static passwd file. Two roles live in the seed:
# `publisher-role` (the CMS backend's own `cms` client — full publish rights on
# devices/#) and `device-role` (subscribe only, scoped to devices/%u/manifest — the `%u`
# placeholder is filled with the connecting client's own username, so one role definition
# is all every device ever needs; a device physically cannot subscribe to another
# device's topic, confirmed live: "All subscription requests were denied.").
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Both dynamic-security.json and the message store below live on the same Railway volume
# mounted at /mosquitto/data — the Docker-image copy in the Dockerfile only ever seeds an
# *empty* volume; every redeploy after the first reuses whatever the volume already holds,
# so devices provisioned yesterday are not wiped by shipping a broker config change today.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
