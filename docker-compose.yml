services:
  db:
    image: postgres:16-alpine
    container_name: signage-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: signage
      POSTGRES_PASSWORD: signage
      POSTGRES_DB: signage
    ports:
      # 5434, not 5432 or 5433: 5433 is strava-comp's, and both projects should
      # be able to run at the same time.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage -d signage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Push-notify prototype (see backend/app/infra/mqtt.py): the CMS publishes here whenever
  # something changes what a device should show, instead of a screen finding out on its next
  # 30s poll. Local/dev only — nothing in production points at this yet.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: signage-cms-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
